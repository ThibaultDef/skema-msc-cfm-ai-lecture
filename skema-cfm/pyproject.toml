[project]
name = "skema-cfm"
version = "0.1.0"
description = "Python project dedicated to CFM course at Skema."
readme = "README.md"
authors = [
    { name = "ThibaultDef", email = "defourneau.thibault@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
ui = [
    "streamlit>=1.66.1",
]

[project.scripts]
skema-cfm-ui = "skema_cfm.ui.cli:main"

[tool.setuptools.package-data]
skema_cfm_agents = [
    "case_data/tables/*.csv",
    "case_data/documents/*.txt",
]